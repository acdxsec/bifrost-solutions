    schema:
      type: object
      properties:
        tenantId:
          type: string
        skuId:
          type: string
        skuPartNumber:
          type: string
        totalUnits:
          type: integer
        assignedUnits:
          type: integer
        availableUnits:
          type: integer
        syncId:
          type: string
        syncedAt:
          type: string
    policies:
      - name: solution_authenticated_access
        actions: [read, create, update, delete]
        when: null
  518c33f3-7a15-4a1c-a887-faa8d2bf9013:
    id: 518c33f3-7a15-4a1c-a887-faa8d2bf9013
    name: m365_license_sync_runs
    description: Microsoft 365 license sync run status and errors.
    schema:
      type: object
      properties:
        syncId:
          type: string
        startedAt:
          type: string
        finishedAt:
          type: string
        status:
          type: string
        customersDiscovered:
          type: integer
        tenantsSucceeded:
          type: integer
        tenantsFailed:
          type: integer
        licenseSkuRows:
          type: integer
    policies:
      - name: solution_authenticated_access
        actions: [read, create, update, delete]
        when: null
