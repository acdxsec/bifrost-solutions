  79d9601c-22a7-4b54-9fd8-731fa0fed8dc:
    id: 79d9601c-22a7-4b54-9fd8-731fa0fed8dc
    name: m365_managed_tenants
    description: GDAP-managed Microsoft customer tenants discovered through Partner Center.
    schema:
      type: object
      properties:
        tenantId:
          type: string
        customerName:
          type: string
        defaultDomain:
          type: string
        relationshipStatus:
          type: string
        skuCount:
          type: integer
        lastSyncAt:
          type: string
        lastError:
          type: string
    policies:
      - name: solution_authenticated_access
        actions: [read, create, update, delete]
        when: null
